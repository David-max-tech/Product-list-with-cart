<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product list with cart</title>
</head>
<body>

    <main class="container">

        <!-- PRODUCTS -->
        <section class="products-section">

            <h1>Desserts</h1>

            <div class="products">

                <!-- Product 1 -->
               <article class="product">

    <div class="product-image">

        <picture>
            <source 
                media="(max-width: 767px)" 
                srcset="./assets/images/image-waffle-mobile.jpg">

            <source 
                media="(max-width: 1023px)" 
                srcset="./assets/images/image-waffle-tablet.jpg">

            <img 
                src="./assets/images/image-waffle-desktop.jpg"
                alt="Waffle with Berries">
        </picture>

    </div>

    <div class="product-info">
        <p class="category">Waffle</p>

        <h2>Waffle with Berries</h2>

        <p class="price">$6.50</p>

        <button class="add-to-cart">
            <img src="./assets/images/icon-add-to-cart.svg" alt="">
            Add to Cart
        </button>
    </div>

</article>>


                <!-- Product 2 -->
                <article class="product">
                    <div class="product-image">
                        <img src="./assets/images/image-creme-brulee-desktop.jpg" alt="Crème Brûlée">
                    </div>

                    <div class="product-info">
                        <p class="category">Crème Brûlée</p>
                        <h2>Vanilla Bean Crème Brûlée</h2>
                        <p class="price">$7.00</p>

                        <button class="add-to-cart">
                            <img src="./assets/images/icon-add-to-cart.svg" alt="">
                            Add to Cart
                        </button>
                    </div>
                </article>


                <!-- Product 3 -->
                <article class="product">
                    <div class="product-image">
                        <img src="./assets/images/image-macaron-desktop.jpg" alt="Macaron">
                    </div>

                    <div class="product-info">
                        <p class="category">Macaron</p>
                        <h2>Macaron Mix of Five</h2>
                        <p class="price">$8.00</p>

                        <button class="add-to-cart">
                            <img src="./assets/images/icon-add-to-cart.svg" alt="">
                            Add to Cart
                        </button>
                    </div>
                </article>

            </div>

        </section>


        <!-- CART -->
        <aside class="cart">

            <h2>Your Cart</h2>

            <div class="cart-content">
                <p>Your added items will appear here</p>
            </div>

        </aside>

    </main>

</body>
</html>
